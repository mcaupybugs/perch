# Builds Perch for macOS (one universal app for Apple silicon + Intel) and Windows, and attaches
# the installers to a GitHub Release. Run it from the Actions tab, or push a tag like v0.1.0.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Perch v__VERSION__
          releaseBody: |
            **macOS** (Apple silicon and Intel): download the `.dmg`, open it and drag Perch to Applications.
            The app isn't signed yet, so the first time macOS will block it: open it once, then go to
            System Settings → Privacy & Security → Open Anyway.

            **Windows**: download the `-setup.exe` (or the `.msi`) and run it. If SmartScreen warns you,
            choose More info → Run anyway.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
