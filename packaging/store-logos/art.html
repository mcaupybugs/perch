<!doctype html>
<!--
  Microsoft Store box art (?kind=box, 1:1) and poster art (?kind=poster, 2:3), full-bleed.
  Render with headless Chrome at the target size: box 2160×2160, poster 1440×2160.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<script>
  const kind = new URLSearchParams(location.search).get("kind") ?? "box";
  const W = 1080, H = kind === "poster" ? 1620 : 1080;

  // Pip, from the app's 32×32 drawing.
  const pip = (x, y, s) => `
    <g transform="translate(${x} ${y}) scale(${s})">
      <path d="M8.5 17.5 L2.5 14 L4.5 20.5 Z" fill="#e9e9ec"/>
      <ellipse cx="15" cy="18.5" rx="9" ry="7.6" fill="#fff"/>
      <circle cx="20.5" cy="11.5" r="5.6" fill="#fff"/>
      <path d="M25.6 10.6 L29.6 12 L25.6 13.4 Z" fill="#a9a9b0"/>
      <circle cx="21.6" cy="14" r="1.3" fill="#c8c8ce" opacity="0.8"/>
      <circle cx="22.4" cy="10.9" r="1.35" fill="#111"/>
      <circle cx="22.85" cy="10.4" r="0.4" fill="#fff"/>
      <path d="M9 17.2 Q14 13.6 19 18.4 Q14 21.6 9 17.2 Z" fill="#d5d5da"/>
      <path d="M13.5 25.5 v3 M17 25.5 v3" stroke="#e9e9ec" stroke-width="1.1" stroke-linecap="round"/>
    </g>`;

  const s = 19; // Pip scale: 32 units → about 600px wide
  const pipW = 32 * s;
  const pipX = (W - pipW) / 2 - 20;
  // Box art: Pip centred. Poster: Pip high, with the name and tagline below.
  const pipY = kind === "poster" ? 300 : (H - 32 * s) / 2 - 30;
  const branchY = pipY + 28.6 * s;

  const text = kind === "poster" ? `
    <text x="${W / 2}" y="${branchY + 250}" text-anchor="middle" fill="#fff"
      font-family="-apple-system, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', sans-serif"
      font-size="148" font-weight="700" letter-spacing="-4">Perch</text>
    <text x="${W / 2}" y="${branchY + 340}" text-anchor="middle" fill="#fff" fill-opacity="0.6"
      font-family="-apple-system, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', sans-serif"
      font-size="44" font-weight="500" letter-spacing="-0.5">Your AI answers, perched.</text>` : "";

  document.body.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1e1e23"/>
          <stop offset="1" stop-color="#030304"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="${(pipY + 16 * s) / H}" r="0.55">
          <stop offset="0" stop-color="#fff" stop-opacity="0.17"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="${W}" height="${H}" fill="url(#bg)"/>
      <rect width="${W}" height="${H}" fill="url(#glow)"/>
      <!-- the notch at the top edge -->
      <path d="M${W / 2 - 230} 0 h460 v54 a46 46 0 0 1 -46 46 h-368 a46 46 0 0 1 -46 -46 Z" fill="#000"/>
      <!-- the perch -->
      <rect x="${W / 2 - 330}" y="${branchY}" width="660" height="24" rx="12" fill="#fff" fill-opacity="0.32"/>
      ${pip(pipX, pipY, s)}
      ${text}
    </svg>`;
</script>
</body>
</html>
